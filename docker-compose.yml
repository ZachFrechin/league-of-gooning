version: '3.8'

services:
  lol-bot:
    build: .
    container_name: lol-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bot.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
